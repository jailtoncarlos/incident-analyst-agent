<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>IAC — App Detail</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; }
#container { width: 100vw; height: 100vh; position: relative; }
svg { width: 100%; height: 100%; }
.controls { position: fixed; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls input { padding: 6px 12px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; font-size: 14px; width: 220px; }
.controls input::placeholder { color: #484f58; }
.controls button { padding: 5px 10px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; font-size: 12px; cursor: pointer; }
.controls button:hover { background: #21262d; }
.controls button.active { background: #1f6feb; border-color: #1f6feb; }
.info { position: fixed; bottom: 12px; left: 12px; z-index: 10; font-size: 12px; color: #484f58; }
.tooltip { position: fixed; padding: 10px 14px; background: #1c2128; border: 1px solid #30363d; border-radius: 8px; font-size: 12px; pointer-events: none; display: none; z-index: 20; max-width: 350px; line-height: 1.5; }
.tooltip b { color: #58a6ff; }
.tooltip .file { color: #7ee787; font-family: monospace; font-size: 11px; }
.tooltip .meta { color: #484f58; }
.node-label { font-size: 10px; fill: #c9d1d9; text-anchor: middle; pointer-events: none; }
.link { stroke-opacity: 0.2; }
.legend { position: fixed; top: 12px; right: 12px; z-index: 10; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-size: 12px; }
.legend div { margin: 3px 0; display: flex; align-items: center; gap: 6px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.back-link { position: fixed; top: 12px; left: 12px; z-index: 10; }
.back-link a { color: #58a6ff; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
<div id="container">
  <div class="back-link"><a href="overview.html">← Overview</a></div>
  <div class="controls" style="top:36px">
    <input type="text" id="search" placeholder="Buscar componente...">
    <button class="filter active" data-type="all">Todos</button>
    <button class="filter" data-type="view">Views</button>
    <button class="filter" data-type="model">Models</button>
    <button class="filter" data-type="form">Forms</button>
    <button class="filter" data-type="template">Templates</button>
    <button class="filter" data-type="url">URLs</button>
  </div>
  <div class="legend">
    <div><b id="app-title"></b></div>
    <div style="margin-top:6px"><span class="dot" style="background:#58a6ff"></span> View</div>
    <div><span class="dot" style="background:#7ee787"></span> Model</div>
    <div><span class="dot" style="background:#f0883e"></span> Form</div>
    <div><span class="dot" style="background:#bc8cff"></span> Template</div>
    <div><span class="dot" style="background:#484f58"></span> URL</div>
    <div style="margin-top:8px;color:#484f58;font-size:11px">Drag = fixa posição</div>
    <div style="color:#484f58;font-size:11px">Duplo-clique = libera</div>
  </div>
  <div class="tooltip" id="tooltip"></div>
  <div class="info" id="info"></div>
  <svg id="svg"></svg>
</div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const DATA = /*__DATA__*/;
const nodes = DATA.nodes;
const links = DATA.links;
const appName = DATA.app_name;

document.getElementById('app-title').textContent = appName;
document.title = `IAC — ${appName}`;

const typeColors = {
  view: '#58a6ff',
  model: '#7ee787',
  form: '#f0883e',
  template: '#bc8cff',
  url: '#484f58',
};

const typeRadius = {
  view: 8,
  model: 7,
  form: 6,
  template: 5,
  url: 4,
};

const edgeColors = {
  url_resolves: '#484f58',
  model_usage: '#7ee787',
  method_call: '#3fb950',
  form_usage: '#f0883e',
  form_model: '#d29922',
  renders: '#bc8cff',
  field_definition: '#388bfd',
};

const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select('#svg').attr('viewBox', [0, 0, width, height]);
const g = svg.append('g');

const zoom = d3.zoom()
  .scaleExtent([0.1, 10])
  .on('zoom', (event) => g.attr('transform', event.transform));
svg.call(zoom);

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(60))
  .force('charge', d3.forceManyBody().strength(-150))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(12));

// Arrowheads
svg.append('defs').selectAll('marker')
  .data(Object.keys(edgeColors))
  .join('marker')
  .attr('id', d => `arrow-${d}`)
  .attr('viewBox', '0 -5 10 10')
  .attr('refX', 20)
  .attr('refY', 0)
  .attr('markerWidth', 6)
  .attr('markerHeight', 6)
  .attr('orient', 'auto')
  .append('path')
  .attr('d', 'M0,-5L10,0L0,5')
  .attr('fill', d => edgeColors[d]);

const link = g.append('g')
  .selectAll('line')
  .data(links)
  .join('line')
  .attr('class', 'link')
  .attr('stroke', d => edgeColors[d.type] || '#30363d')
  .attr('stroke-width', 1)
  .attr('marker-end', d => `url(#arrow-${d.type})`);

const node = g.append('g')
  .selectAll('g')
  .data(nodes)
  .join('g')
  .attr('class', 'node')
  .call(d3.drag()
    .on('start', dragstarted)
    .on('drag', dragged)
    .on('end', dragended));

node.append('circle')
  .attr('r', d => typeRadius[d.type] || 6)
  .attr('fill', d => typeColors[d.type] || '#484f58')
  .attr('stroke', '#0d1117')
  .attr('stroke-width', 1.5)
  .style('cursor', 'pointer');

node.append('text')
  .attr('class', 'node-label')
  .attr('dy', d => (typeRadius[d.type] || 6) + 12)
  .text(d => d.label);

// --- Estado global de interação ---
const tooltip = d3.select('#tooltip');
let activeFilter = 'all';
let selectedNode = null;
let searchTerm = '';

// Funções auxiliares
function isNodeVisible(d) {
  const matchType = activeFilter === 'all' || d.type === activeFilter;
  const matchSearch = !searchTerm || d.label.toLowerCase().includes(searchTerm) || d.id.toLowerCase().includes(searchTerm);
  return matchType && matchSearch;
}

function getConnected(nodeId) {
  const connected = new Set([nodeId]);
  links.forEach(l => {
    const srcId = l.source.id || l.source;
    const tgtId = l.target.id || l.target;
    if (srcId === nodeId || tgtId === nodeId) {
      connected.add(srcId);
      connected.add(tgtId);
    }
  });
  return connected;
}

function isLinkConnectedTo(l, nodeId) {
  return (l.source.id || l.source) === nodeId || (l.target.id || l.target) === nodeId;
}

// --- Renderização central ---
function render() {
  const connected = selectedNode ? getConnected(selectedNode) : null;

  node.style('opacity', d => {
    if (!isNodeVisible(d)) return 0.05;
    if (connected && !connected.has(d.id)) return 0.08;
    return 1;
  });

  link.attr('stroke-opacity', l => {
    const srcNode = nodes.find(n => n.id === (l.source.id || l.source));
    const tgtNode = nodes.find(n => n.id === (l.target.id || l.target));
    if (!srcNode || !tgtNode) return 0.02;

    // Se há filtro ativo, ambos os nós precisam ser visíveis
    const srcVisible = isNodeVisible(srcNode);
    const tgtVisible = isNodeVisible(tgtNode);
    if (!srcVisible && !tgtVisible) return 0.02;

    // Se há nó selecionado, mostrar apenas arestas conectadas
    if (connected) {
      return isLinkConnectedTo(l, selectedNode) && (srcVisible || tgtVisible) ? 0.8 : 0.02;
    }

    return (srcVisible || tgtVisible) ? 0.25 : 0.02;
  });
}

// --- Tooltip (hover) ---
node.on('mouseover', (event, d) => {
  if (!isNodeVisible(d)) return;

  let html = `<b>${d.label}</b> <span class="meta">(${d.type})</span><br>`;
  if (d.file) html += `<span class="file">${d.file}${d.line ? ':' + d.line : ''}</span><br>`;
  if (d.fields && d.fields.length) html += `Fields: ${d.fields.slice(0,8).join(', ')}${d.fields.length > 8 ? '...' : ''}<br>`;
  if (d.methods && d.methods.length) html += `Methods: ${d.methods.slice(0,8).join(', ')}${d.methods.length > 8 ? '...' : ''}<br>`;

  // Contar conexões visíveis
  let connCount = 0;
  links.forEach(l => { if (isLinkConnectedTo(l, d.id)) connCount++; });
  html += `<span class="meta">Conexões: ${connCount}</span>`;

  tooltip.style('display', 'block').html(html);

  // Hover highlight temporário (só se não há nó selecionado)
  if (!selectedNode) {
    const hovered = getConnected(d.id);
    node.style('opacity', n => {
      if (!isNodeVisible(n)) return 0.05;
      return hovered.has(n.id) ? 1 : 0.08;
    });
    link.attr('stroke-opacity', l => {
      if (!isLinkConnectedTo(l, d.id)) return 0.02;
      const srcNode = nodes.find(n => n.id === (l.source.id || l.source));
      const tgtNode = nodes.find(n => n.id === (l.target.id || l.target));
      return (srcNode && isNodeVisible(srcNode)) || (tgtNode && isNodeVisible(tgtNode)) ? 0.8 : 0.02;
    });
  }
})
.on('mousemove', (event) => {
  tooltip.style('left', (event.clientX + 15) + 'px')
    .style('top', (event.clientY - 10) + 'px');
})
.on('mouseout', () => {
  tooltip.style('display', 'none');
  render(); // Restaura estado baseado no filtro + seleção
});

// --- Clique: selecionar/deselecionar nó ---
node.on('click', (event, d) => {
  if (!isNodeVisible(d)) return;
  selectedNode = (selectedNode === d.id) ? null : d.id;
  render();
});

// --- Filtro por tipo ---
d3.selectAll('.filter').on('click', function() {
  d3.selectAll('.filter').classed('active', false);
  d3.select(this).classed('active', true);
  activeFilter = this.dataset.type;
  selectedNode = null; // Limpa seleção ao mudar filtro
  render();
});

// --- Busca ---
d3.select('#search').on('input', function() {
  searchTerm = this.value.toLowerCase();
  selectedNode = null;

  // Se a busca encontra exatamente um nó, seleciona e faz zoom
  if (searchTerm) {
    const matches = nodes.filter(n => isNodeVisible(n));
    if (matches.length === 1) {
      selectedNode = matches[0].id;
      zoomToNode(matches[0]);
    } else if (matches.length > 0 && matches.length <= 5) {
      // Poucas correspondências: zoom para caber todas
      zoomToFit(matches);
    }
  }
  render();
  updateInfo();
});

// Enter na busca: seleciona o primeiro match e faz zoom
d3.select('#search').on('keydown', function(event) {
  if (event.key === 'Enter') {
    const matches = nodes.filter(n => isNodeVisible(n));
    if (matches.length > 0) {
      selectedNode = matches[0].id;
      zoomToNode(matches[0]);
      render();
    }
  }
  // Escape: limpa busca e seleção
  if (event.key === 'Escape') {
    this.value = '';
    searchTerm = '';
    selectedNode = null;
    render();
    updateInfo();
  }
});

function zoomToNode(d) {
  const scale = 2;
  const x = -d.x * scale + width / 2;
  const y = -d.y * scale + height / 2;
  svg.transition().duration(500)
    .call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(scale));
}

function zoomToFit(matchedNodes) {
  const xs = matchedNodes.map(d => d.x);
  const ys = matchedNodes.map(d => d.y);
  const minX = Math.min(...xs) - 50;
  const maxX = Math.max(...xs) + 50;
  const minY = Math.min(...ys) - 50;
  const maxY = Math.max(...ys) + 50;
  const dx = maxX - minX;
  const dy = maxY - minY;
  const scale = Math.min(width / dx, height / dy, 3) * 0.8;
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const x = width / 2 - cx * scale;
  const y = height / 2 - cy * scale;
  svg.transition().duration(500)
    .call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(scale));
}

function updateInfo() {
  const visible = nodes.filter(n => isNodeVisible(n)).length;
  const total = nodes.length;
  const extra = searchTerm ? ` (${visible} visíveis)` : '';
  d3.select('#info').text(`${appName}: ${total} componentes, ${links.length} arestas${extra}`);
}

simulation.on('tick', () => {
  link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
});

d3.select('#info').text(`${appName}: ${nodes.length} componentes, ${links.length} arestas`);

function dragstarted(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
function dragended(event, d) { if (!event.active) simulation.alphaTarget(0); /* fx/fy mantidos: nó fica fixo onde foi solto */ }

// Duplo-clique libera o nó fixado
node.on('dblclick', (event, d) => { d.fx = null; d.fy = null; simulation.alphaTarget(0.1).restart(); });
</script>
</body>
</html>

[project]
name = "incident-analyst-agent"
version = "0.1.0"
description = "Agente de análise técnica de incidentes de software, capaz de investigar código, reconstruir fluxos, simular cenários e propor resolução com resposta operacional estruturada."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jailton Carlos de Paiva", email = "jailtoncarlos@gmail.com"},
]
keywords = ["incident", "triage", "agent", "django", "llm", "code-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "python-gitlab>=4.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
github = ["PyGithub>=2.0"]
gemini = ["google-generativeai>=0.5"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
iac = "iac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iac"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors — estilo PEP 8 (indentação, espaços)
    "F",    # pyflakes — imports não usados, variáveis undefined
    "W",    # pycodestyle warnings — trailing whitespace, etc.
    "I",    # isort — ordenação de imports
    "N",    # pep8-naming — CamelCase para classes, snake_case para funções
    "UP",   # pyupgrade — sintaxe moderna (isinstance union, f-strings)
    "S",    # bandit/security — vulnerabilidades (subprocess, passwords)
    "B",    # bugbear — bugs comuns (loop var não usada, zip sem strict)
    "SIM",  # simplify — simplificações (nested if → single if)
    "PIE",  # flake8-pie — redundâncias desnecessárias
    "D",    # pydocstyle — docstrings Google convention
]
ignore = [
    "S107",   # hardcoded password (falso positivo)
    "S101",   # assert em testes
    "D100",   # missing module docstring em scripts
    "D104",   # missing __init__ docstring
    "D203",   # conflita com D211 (blank line before docstring)
    "D212",   # conflita com D213 (multi-line summary first line)
    "D415",   # first line punctuation (muito restritivo)
    "D105",   # missing magic method docstring
    "D107",   # missing __init__ docstring
    "E501",   # line too long (já temos line-length=120)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # testes não precisam de docstring completa

[tool.pytest.ini_options]
testpaths = ["tests"]
